<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Selected U.S. console hardware price snapshots</title>
  <desc id="desc">A GCX editorial chart showing selected average selling price snapshots rising from 235 dollars in November 2019 to 542 dollars in July 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14161d"/>
      <stop offset="0.55" stop-color="#25212a"/>
      <stop offset="1" stop-color="#f4b34a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="52" y="52" width="1096" height="571" rx="28" fill="#fffaf0" filter="url(#shadow)"/>
  <text x="94" y="128" fill="#15171d" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="800">The $542 Console Problem</text>
  <text x="94" y="168" fill="#5a5f6b" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Selected U.S. new video game hardware average selling price snapshots</text>
  <g transform="translate(110 220)">
    <line x1="0" y1="340" x2="960" y2="340" stroke="#d8d1c4" stroke-width="3"/>
    <line x1="0" y1="250" x2="960" y2="250" stroke="#ebe5d9" stroke-width="2"/>
    <line x1="0" y1="160" x2="960" y2="160" stroke="#ebe5d9" stroke-width="2"/>
    <line x1="0" y1="70" x2="960" y2="70" stroke="#ebe5d9" stroke-width="2"/>
    <polyline points="35,324 350,150 665,80 925,42" fill="none" stroke="#d13f32" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#15171d" font-family="Arial, Helvetica, sans-serif" font-weight="800">
      <circle cx="35" cy="324" r="13" fill="#d13f32"/>
      <circle cx="350" cy="150" r="13" fill="#d13f32"/>
      <circle cx="665" cy="80" r="13" fill="#d13f32"/>
      <circle cx="925" cy="42" r="13" fill="#d13f32"/>
      <text x="6" y="306" font-size="28">$235</text>
      <text x="319" y="132" font-size="28">$439</text>
      <text x="634" y="62" font-size="28">$502</text>
      <text x="892" y="24" font-size="32">$542</text>
    </g>
    <g fill="#5a5f6b" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">
      <text x="0" y="382">Nov. 2019</text>
      <text x="303" y="382">Nov. 2025</text>
      <text x="625" y="382">May 2026</text>
      <text x="882" y="382">July 2026</text>
    </g>
  </g>
  <rect x="94" y="585" width="1012" height="1" fill="#ddd4c6"/>
  <text x="94" y="618" fill="#6d7280" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">GCX chart. Selected nominal snapshots; not a continuous index. Derived values should be labeled clearly in article tables.</text>
</svg>
